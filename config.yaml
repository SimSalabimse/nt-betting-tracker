# NT Betting Tracker — single source of numeric truth
# Phase, risk caps, and stake bands change automatically via the phase engine.

project:
  name: nt-betting-tracker
  currency: NOK
  operator: Norsk Tipping Oddsen

bankroll:
  # Clean-restart era (fresh start 2026-07-22, closed-loop + Phase v5).
  # Prior live book archived under history/archives/fresh_start_20260721_235802/
  baseline_nok: 500.0
  era_start: "2026-07-22"
  # Equity = baseline + sum(settled P/L) over data/bets.csv only (no pre-restart archive in equity).
  include_era_archive: false

norsk_tipping:
  min_stake_nok: 10.0
  # Decimal odds only in this system
  max_legs_in_combo: 3
  # NT account totalgrense (operator mirror). Headroom hard-binds remaining_risk.
  # residual_buffer: refuse tickets that leave residual headroom below this (default 5000).
  # Set daily_limit_nok / monthly_limit_nok to your NT limits (null = unconstrained period).
  totalgrense:
    enabled: true
    residual_buffer_nok: 5000
    daily_limit_nok: null
    monthly_limit_nok: null

# Phase ladder v4 + hybrid half-steps (1A+/1B+) — see docs/PHASE_PLAN.md
# Hybrid: equity ladder is primary; settled-count may unlock at most +1 phase if stable.
# daily_risk = clamp(equity * daily_risk_pct, floor, ceil)  — recomputed every run.
# Half-steps keep parent hard gates via hard_phase_id (max_doubles, max_bets).
# Continuous unit / open-risk progress inside each band when phase_continuous.enabled.
phases:
  "1A":
    label: Protect
    enter_equity: 0
    enter_settled: 0
    stake_min: 10
    stake_max: 12
    # High-Volume v2: ~3 target; 5 seats so 20% run budget can pack without stranding
    max_bets_per_round: 5
    max_doubles_per_round: 0
    daily_risk_pct: 0.08
    daily_risk_floor: 30
    daily_risk_ceil: 42
    next: "1A+"
  "1A+":
    label: Protect+
    enter_equity: 540
    enter_settled: 30
    # stake floor = 1A max so continuous unit does not drop at half-step
    stake_min: 12
    stake_max: 14
    max_bets_per_round: 5
    max_doubles_per_round: 0
    daily_risk_pct: 0.085
    daily_risk_floor: 34
    daily_risk_ceil: 47
    hard_phase_id: "1A"   # doubles / max_bets / hard gates inherit 1A
    next: "1B"
  "1B":
    label: Stabilize
    enter_equity: 580
    enter_settled: 60
    stake_min: 12
    stake_max: 15
    max_bets_per_round: 4
    max_doubles_per_round: 0   # no doubles until Phase 2
    daily_risk_pct: 0.09
    daily_risk_floor: 38
    daily_risk_ceil: 52
    next: "1B+"
  "1B+":
    label: Stabilize+
    enter_equity: 620
    enter_settled: 75
    # stake floor bridges 1B toward Phase 2 continuous
    stake_min: 13
    stake_max: 16
    max_bets_per_round: 4
    max_doubles_per_round: 0
    daily_risk_pct: 0.095
    daily_risk_floor: 44
    daily_risk_ceil: 62
    hard_phase_id: "1B"   # doubles / max_bets / hard gates inherit 1B
    next: "2"
  "2":
    label: Build
    enter_equity: 750
    enter_settled: 90
    # stake_min bridges 1B+ continuous at 750 (~14); code also carry-forwards
    stake_min: 14
    stake_max: 18
    max_bets_per_round: 5
    max_doubles_per_round: 1
    daily_risk_pct: 0.10
    daily_risk_floor: 50
    daily_risk_ceil: 75
    next: "3"
  "3":
    label: Expand
    enter_equity: 1200
    enter_settled: 130
    # bridges phase 2 continuous at 1200 (~16)
    stake_min: 16
    stake_max: 28
    max_bets_per_round: 6
    max_doubles_per_round: 2
    daily_risk_pct: 0.09
    daily_risk_floor: 70
    daily_risk_ceil: 140
    next: "4"
  "4":
    label: Mature
    enter_equity: 2500
    enter_settled: 180
    # bridges phase 3 continuous at 2500 (~28, band max)
    stake_min: 28
    stake_max: 45
    max_bets_per_round: 7
    max_doubles_per_round: 2
    daily_risk_pct: 0.07
    daily_risk_floor: 100
    daily_risk_ceil: 250
    next: "5"
  "5":
    label: Scale
    enter_equity: 5000
    enter_settled: 250
    # bridges phase 4 continuous at 5000 (~45, band max)
    stake_min: 45
    stake_max: 70
    max_bets_per_round: 8
    max_doubles_per_round: 3
    daily_risk_pct: 0.06
    daily_risk_floor: 120
    daily_risk_ceil: 400
    next: null

# Continuous unit + open-risk progress inside each named phase / half-step.
# unit = stake_min + (equity - enter) / scale_factor  (clamped to [stake_min, stake_max], whole krone)
# ~1 NOK unit step per scale_factor equity (default 100 → visible every ~80–120 NOK).
# open-risk floor/ceil/pct lerp from current phase toward next by progress_inside_phase.
phase_continuous:
  enabled: true
  scale_factor: 100.0

# Stability gates for count-unlock and demotion (see docs/PHASE_PLAN.md)
phase_stability:
  min_rolling_settled: 25
  min_rolling_roi: 0.0          # count unlock only if rolling window not red
  demote_if_rolling_roi_below: -0.10
  demote_min_settled: 25
  # Drop one phase if equity falls this far below peak end-of-day equity
  demote_drawdown_pct_of_peak: 0.12

risk:
  # Kill-switch: no new bets if today's realized P/L <= -stop_day_loss_nok
  # or open+planned risk would exceed daily cap.
  stop_day_loss_pct_of_equity: 0.08
  stop_day_loss_floor_nok: 40
  # After this many consecutive settled losses, require grade A only
  loss_streak_grade_a_only: 3

# Early-bankroll regimes (orthogonal to phase ladder). Clean 500 NOK restart → Exploration.
# Open-risk caps count Pending+ConfirmedPlaced only — free immediately on settlement (W/L).
# Sports start equal (no regime sport mults). High-Volume v2: 3pp haircut hard.
# Exploration: min-EV 2% after 3pp; open cap 100 so ~3 unit-scale bets fit under 20% run budget.
bankroll_regime:
  enabled: true
  exploration:
    exit_settled: 40            # OR equity ≥ exit_equity
    exit_equity: 650
    min_ev: 0.02                # 2% after 3pp haircut (High-Volume v2)
    open_risk_cap_nok: 100      # pending-only; allows ~3 grade-B stakes at unit 12
    prefer_mid_odds: false      # ESR: mid-band is not research/place identity
    mid_odds_lo: 1.85
    mid_odds_hi: 2.60
    weekly_explore_max: 2       # unit bets/week at thin EV band (legacy quota)
    explore_min_ev: 0.01        # absolute-adjacent floor for thin quota only
    explore_max_ev: 0.02        # exclusive upper (= full floor)
    explore_odds_lo: 1.85
    explore_odds_hi: 2.60
    explore_require_alt_or_mid: true
  survival:
    exit_settled: 100           # OR equity ≥ exit_equity
    exit_equity: 800
    min_ev: 0.03                # 3% after haircut (was 7.5% — starved volume)
    open_risk_cap_nok: 100
    prefer_mid_odds: false      # ESR: mid-band is not research/place identity
    mid_odds_lo: 1.85
    mid_odds_hi: 2.60

# Phase 2 capital_v2 — live. Env: CAPITAL_V2_ENABLED / NT_CAPITAL_V2_ENABLED
capital_v2:
  enabled: true
  # High-Volume v2: base unit 12 under 1500 liquid; grade stake mults; secure Variant A
  unit_ladder:
    - { max_liquid_exclusive: 1500.0, unit: 12.0 }
    - { max_liquid_exclusive: 2500.0, unit: 15.0 }
    - { max_liquid_exclusive: null, unit: 20.0 }
  grade_stake_mult:
    C: 1.0
    B: 1.4
    A: 2.0
    A_high_conf: 2.2
  secure_bucket:
    enabled: true
    # Variant A (live): soft 1.25×/15%, hard 1.50×/30% (hard replaces soft, not stacked)
    variant: A
    soft_trigger_multiple_of_ref: 1.25
    soft_transfer_fraction: 0.15
    hard_trigger_multiple_of_ref: 1.50
    hard_transfer_fraction: 0.30
    # --- Switch recipes (do not enable B and C at once; last YAML key wins) ---
    # To use Variant B (single-tier 1.30× / 0.27): set variant: B below.
    #   Soft/hard keys are ignored when variant != A. Optional explicit:
    # variant: B
    # trigger_multiple_of_ref: 1.30
    # transfer_fraction_of_profit_above_ref: 0.27
    # To use Variant C (single-tier 1.40× / 0.35): set variant: C and:
    # variant: C
    # trigger_multiple_of_ref: 1.40
    # transfer_fraction_of_profit_above_ref: 0.35
    min_working_frac_of_equity: 0.55
    min_working_units: 8.0
    unlock_after_settled: 25          # auto release secure→working after N settles since skim
    manual_unlock_cooldown_days: 7    # min days between manual unlocks

selection:
  # High-Volume v2: hard 3pp haircut (was 5pp). Never softened by regime/coverage.
  probability_haircut: 0.03
  standard_min_ev: 0.02          # 2.0% after haircut
  strong_min_ev: 0.015           # 1.5% when multi-source / high-confidence
  absolute_min_ev: 0.01           # never place below 1.0%
  strong_min_sources: 8
  # Grade C placeable when core reason is clear (see portfolio)
  grade_c_placeable: true
  grade_c_require_core_reason: true
  grade_c_min_sources: 4
  # P1: Grade A needs p_model_sd, edge CI, or multi-model — not bare point p
  grade_a_require_uncertainty: true
  # Odds > threshold are ALLOWED when evidence supports them — not banned.
  # ESR K16: usable_hi == high_odds_threshold (2.50); high-odds path is strict > thr (PR2 code).
  high_odds_threshold: 2.5
  high_odds_min_grade: B
  high_odds_min_ev: 0.04
  high_odds_stake_multiplier: 0.6
  high_odds_max_per_round: 2
  # Sport-Aware Evidence Framework (SAEF) — sport research cards + scoring
  # ESR PR1 kill-switch (research-reset-simple-effective-2026-07-25):
  #   place_uses_saef = enabled AND NOT shadow_mode AND forced_hierarchy.enabled
  #   → False with shadow_mode true + forced_hierarchy.enabled false (legacy grade path).
  # Residual volume killers until PR2: Band A hard H2H/rank, promo hardcodes
  # preferred+25 / short_main-30, mid-band window ignored; re-arm only if overlay
  # omits coverage_preferred_share (None→0.55); n_pref_avail==0 empty queue.
  evidence:
    enabled: true
    shadow_mode: true           # ESR: demote FEH place ownership (was false)
    fail_closed: false          # ESR: incomplete checklist is soft, not auto-F
    auto_onboard_cards: true
    strict_band_cd: true
    quarantine_unknown: true
    allow_quarantine_place: false
    sport_cards_dir: evidence/sport_cards
    card_schema_version: 1
    min_takeaway_chars: 24
    min_quality_sources_floor: 3
    min_quality_sources_b: 4
    min_quality_sources_a: 6
    min_E_grade_b: 0.55
    min_E_grade_a: 0.72
    min_E_grade_c: 0.30
    infer_min_confidence: 0.65
    forced_hierarchy:
      enabled: false            # ESR PRIMARY KILL: FEH no longer place-owns
      require_checklist: false
      anti_soft_underdog: false
      allow_soft_ud_grade_c: true
      natural_market_elevation: false
      side_first: false
      soft_ud_odds_lo: 1.70
      soft_ud_odds_hi_hard: 2.20
      soft_ud_odds_hi_soft: 2.60
      anti_soft_ml_dogs:
        individual_sports: true
        team_sports: false
  # Sliding odds-band confidence (usable 1.40-2.50 = high_odds_threshold). ESR relaxed floors.
  # Does not change capital_v2 / phase / secure. Residual Band A hard path → PR2 soft-demote.
  odds_confidence:
    enabled: true
    usable_lo: 1.40
    usable_hi: 2.50
    underdog_hc_negative_h2h_reject: false
    soft_missing_matchup_stake_mult: 0.85   # PR2 Band A soft-demote stake haircut
    bands:
      A:  # Short 1.40-1.60 (ESR: Grade B + 4 sources; H2H/rank soft-demote in PR2)
        lo: 1.40
        hi: 1.60
        min_grade: B
        min_ev: 0.02
        min_sources: 4
        stake_mult: 0.95
        require_h2h_or_rank_form: true   # keep for PR2 soft-demote (not hard-fail target)
        explore_allowed: false
      B:  # Short-medium 1.60-1.85
        lo: 1.60
        hi: 1.85
        min_grade: B
        min_ev: 0.02
        min_sources: 4
        stake_mult: 1.0
        require_core_plus_support: true
        explore_allowed: false
      C:  # Core 1.85-2.30
        lo: 1.85
        hi: 2.30
        min_grade: B
        min_ev: 0.02
        min_sources: 4
        stake_mult: 1.0
        require_core_plus_support: false
        require_h2h_checked: false
        explore_allowed: true
        explore_ev_cap: 0.015
      D:  # Upper 2.30-2.50 (ends at usable_hi / high_odds_threshold)
        lo: 2.30
        hi: 2.50
        min_grade: B
        min_ev: 0.025
        min_sources: 5
        stake_mult: 0.95
        require_core_plus_support: true
        require_h2h_checked: false
        underdog_hc_require_matchup: false
        explore_allowed: true
        explore_ev_cap: 0.015
    below_floor:  # < 1.40 exceptional Grade A only
      allow_exceptional: true
      min_grade: A
      min_ev: 0.04
      min_sources: 6
      stake_mult: 0.75
  # Temporary ESR test stake cap: max 10 NOK for first 10 place-acked bets under system_tag.
  # Absolute-last ceiling after rebalance + EXPLORE_REGIME clamp - does not change capital_v2 math.
  # Counter resets on system_tag change (tag is SSOT). Soft-reset script also writes explicit n_placed=0.
  # Operator soft reset (scripts/soft_reset_data_first_500.py) updates bankroll.era_start on --confirm.
  # NOTE_TAG_PREFIX → TEST_CAP: and optional path rename in PR2.
  test_stake_cap:
    enabled: true
    max_bets: 10
    max_stake_nok: 10.0
    system_tag: esr_data_v1
    state_path: data/state/feh_test_cap.json

  # If historical band ROI is terrible with enough sample, raise the bar further
  band_penalty:
    min_sample: 15
    bad_roi_below: -0.10
    extra_ev_required: 0.05
  # Soft prior flattened 1.40–2.50 (ESR: neutralize mid-odds price identity)
  band_prior_boost:
    "<1.5": 0.0
    "1.5-1.8": 0.0
    "1.8-2.2": 0.0
    "2.2-2.5": 0.0
    "2.5-3.0": -0.01
    ">=3.0": -0.02
  min_research_sources:
    default: 4
    grade_A: 8
    high_odds: 8
  empty_slip_ok: true

# Per research/recommend run: sum of stakes ≤ this fraction of equity
# (also min'd with remaining_risk_nok — fail-closed).
recommend:
  max_run_stake_pct_of_equity: 0.20
# Ledger-driven learning loop (recomputed on settle / `nt learn` / refresh)
# Does NOT rewrite this file — live mults live in data/state/learning.json
learning:
  enabled: true
  # Agent applies settlement proposals automatically (no human accept/reject click)
  auto_apply_proposals: true
  min_sample: 12              # below this → stake×1.0, EV boost 0
  recent_window: 30           # last N settled per group for form blend
  recent_weight: 0.40         # blend weight on recent ROI (rest = all-time)
  # How much to trust older / thinner-process history for mults
  weight_mode: weighted       # weighted | equal | process_only
  half_life_days: 60          # recency decay for learning weights
  archive_process_weight: 0.35
  live_no_model_weight: 0.60
  full_process_weight: 1.0
  stake_mult_min: 0.72
  stake_mult_max: 1.18
  stake_roi_scale: 0.90       # stake_mult ≈ 1 + roi * scale * confidence
  ev_boost_min: -0.045
  ev_boost_max: 0.035
  ev_roi_scale: 0.12          # EV += roi * scale * confidence
  block_min_sample: 20        # soft-block only with real sample
  block_roi_below: -0.18      # blended ROI ≤ this → reject sport/market
  max_lessons: 14
  # Avoid getting stuck in one sport / market type (counts OPEN PENDING + new slip)
  diversification:
    max_per_sport: 2          # max open bets of same sport (pending + this recommend)
    max_per_market: 2         # max open of same market family
    max_per_band: 3
    # Phase 2: one open market per match (pending + slip) — blocks correlated stacks
    max_per_match: 1
    # P1 soft correlation (known leagues/scripts/KO windows only)
    max_per_league: 2
    max_per_script_family: 2
    ko_window_hours: 3
    max_per_ko_window: 2
    # Soft football preference only:
    #   1) non-football first
    #   2) up to max_football_per_round football while diversifying
    #   3) fill remaining seats with more good football (e.g. BTTS Nei) up to max_per_sport
    # Never leave empty slip seats just because "1 football max" was preferred earlier.
    max_football_per_round: 1   # soft preference only — fill-up pass may take more
    min_non_football_per_round: 1
    prefer_explore_first: true
    # Exploration: under-sampled groups get a small EV nudge (not free money)
    explore_min_n: 0          # 0 = allow virgin sports/markets (n=0)
    explore_max_n: 14         # below min_sample → still "thin"
    explore_ev_boost: 0.018
    explore_virgin_ev_boost: 0.022
    explore_stake_floor: 0.92
    explore_min_roi: -0.15    # don't explore groups that are already deep red
    explore_min_ev: 0.012     # lower EV bar for explore-flagged lines
    # Explore boost only when base model EV clears this floor (PR2 wire-up)
    explore_base_ev_min: 0.005
    sort:
      similar_penalty_weight: 1.0
      # underrep detection not implemented — keep 0 until diversify macro lands
      macro_underrep_bonus: 0.0
      explore_tiebreak: true
      continuity_penalty_weight: 1.0
    # Form continuity / anti-flip (PR2 portfolio wire-up — enabled true)
    # Ops note: first live day may set weak_flip_action: demote_only, then soft_reject.
    form_continuity:
      enabled: true
      live_ledger_only: true
      anchor_scan_limit: 30
      max_hours: 48
      max_games: 2
      heavy_fav_max_odds: 2.10
      include_pending_anchors: true
      base_penalty: 0.035
      pending_penalty: 0.015
      weak_extra_penalty: 0.025
      convincing_win_mult: 1.25
      strong_flip_min_ev: 0.06
      weak_flip_action: soft_reject  # soft_reject | demote_only
      heavy_line_by_sport:
        baseball: 1.5
        basketball: 5.5
        football: 1.5
        ice_hockey: 1.5
        tennis: 2.5
        darts: 2.5
        esports: 1.5
        default: 1.5
    # Ranking-gap HC soft cap (PR4 — soft max 1 with EV-slack peers)
    ranking_gap_hc:
      enabled: true
      max_per_slip: 1
      ev_slack: 0.015
      soft_skip_reason: "ranking_gap_hc: soft cap 1 per slip"
  # P1: process_error settle tags → temporary min_ev raise
  process_gate:
    enabled: true
    min_ev_raise: 0.02
    max_raise: 0.05
    ttl_hours: 48
    clear_after_clean_settles: 3
  # Settlement taxonomy: sample influence × learning_weight; CS gate threshold
  min_learning_weight_for_gate: 0.5   # process_error temp_gate only if weight ≥ this
  # P0 ControlSignals (temp_gate_raise + force_coverage_priority + temp_ev_relax)
  control_signals:
    enabled: true
    min_ev_raise: 0.02
    max_raise: 0.05
    ttl_days: 10
    force_confirmed_lineup: true
    min_learning_weight_for_gate: 0.5  # one-offs / true_randomness skip temp_gate
    coverage_priority:
      enabled: true
      ttl_days: 5                 # clamp 4–7
      min_deep_packs: 8
      target_odds_band: "1.40-2.80"   # ESR: widen research-rank band
      prefer: [alt_totals, handicaps, period, natural_totals]  # no pure dogs
      near_empty_max_picks: 1
      min_no_pmodel_reject_share: 0.70
      min_mid_unresearched: 3
      coverage_preferred_share: 0.0  # ESR: emit 0 so re-arm cannot force 0.55; PR2: guard when key omitted
      weight_boost: 30.0            # deep-queue score boost under active signal
    # Mechanism B: temporary auditable EV softening (safety net only)
    # Per-line allowlist · never softens haircut · grade F always excluded
    # Fail-closed: if process_gate_raise > 0 for a candidate, skip temp_ev_relax
    temp_ev_relax:
      enabled: true
      delta_min: 0.01
      delta_max: 0.02
      ttl_hours: 24
      clear_on_settle: true     # per-signal flag also stamped on emit; settle clears only clearable ids
      stake_mult: 0.80          # extra 20% reduction while active
      top_n_survivors: 3
      min_board_matches: 15
      require_coverage_warn: true
      exclude_high_odds: true   # honored in portfolio (default fail-closed)
      exclude_grade_c: true     # honored in portfolio (default fail-closed)

paths:
  bets: data/bets.csv
  state_dir: data/state
  inbox: inbox
  outbox: outbox
  evidence: evidence
  history: history
  status: data/state/status.md
  bankroll_md: data/state/current_bankroll.md
  edges_jsonl: data/edges.jsonl
  edges_summary: data/state/edges_summary.md
  # Rich settlement / learning (optional; defaults under state_dir)
  # learning_proposals_json: data/state/learning_proposals.json
  # settlement_reviews_jsonl: data/state/settlement_reviews.jsonl
  learning_json: data/state/learning.json
  learning_history_jsonl: data/state/learning_history.jsonl
  decisions_jsonl: data/state/bet_decisions.jsonl
  # Forensic process densify: bet_id → evidence pack hard/soft links
  evidence_links_jsonl: data/state/evidence_links.jsonl
  # v5 optional (agent creates on first use)
  agent_audit_jsonl: data/state/agent_audit.jsonl
  # v6: calibration log (p_model vs outcome)
  calibration_jsonl: data/state/calibration.jsonl
  # Recommend reasoning chains (pick + near-miss audit)
  reasoning_chains_jsonl: data/state/reasoning_chains.jsonl

# Minimal reasoning-chain dump on recommend (dry-run OK) → JSONL + PLACE_THESE ## Reasoning
reasoning:
  enabled: true
  jsonl: data/state/reasoning_chains.jsonl
  max_near_miss: 8
  near_miss_ev_slack: 0.04
  place_md_section: true

# --- v5 additive policy (all optional; missing keys use safe defaults in nt/defaults.py) ---

# Multi-leg / combos — Phase 2+ may take doubles when max_doubles_per_round > 0.
# Singles remain primary; recommend builds up to phase max doubles from clear EV legs.
combos:
  enabled: true
  aggressiveness: standard   # off | conservative | standard | aggressive
  stake_multiplier: 0.55
  min_correlation_score: 0.50
  allow_high_odds_legs: false
  min_leg_grade: B
  min_leg_ev: 0.025
  require_per_leg_evidence: true
  trebles_min_phase: "4"
  # max_legs inherited from norsk_tipping.max_legs_in_combo when unset

# Optional AI agent — assist only; never places bets or writes bets.csv
agent:
  enabled: false
  provider: auto          # auto | xai | openai | none
  model: ""               # empty → provider default (grok-3 / gpt-4o-mini)
  max_tool_rounds: 6
  audit_log: data/state/agent_audit.jsonl
  allow_cli_dry_run: true
  allow_write_evidence_scaffold: true
  temperature: 0.2

# Monte Carlo projection defaults for `nt project`
projection:
  default_years: 2
  default_sims: 1000
  default_roi: 0.02
  default_bets_per_week: 10
  default_avg_odds: 1.85
  seed: 42

# Research helpers for `nt research` — board-first workflow
research:
  templates_dir: evidence/templates
  default_sport: football
  min_summary_chars: 20
  min_failure_modes_chars: 10
  # Match Intelligence Cards (MIC) — free structured facts before deep research
  # require_for_deep stays false until Exa/MIC exit criteria (PR6)
  match_intel:
    enabled: true
    v1_sports: [football]
    require_for_deep: false
    require_for_deep_sports: null   # null → same as v1_sports
    min_coverage_grade_for_deep: C
    out_dir: outbox/match_intel
    max_board_matches: 40
    max_matches_per_run: 40
    budget_seconds: 480
    ttl_hours: 6
    concurrency: 1
    timeout_s: 45
    circuit_break_failures: 5
    alias_path: data/state/match_aliases.json
    sources_priority: [norsk_tipping, flashscore, fotmob, other_public]
    allow_network: false            # tests/CI: offline only; ops: --allow-network
    fetch:
      prefer: firecrawl             # firecrawl | playwright | http
      primary: firecrawl            # legacy alias of prefer
      fallback: http
      allow_firecrawl: true
      cache_dir: data/cache/match_intel_fetch
      cache_ttl_hours: 6
      timeout_s: 45
      min_interval_ms_per_host: 1200
      circuit_open_seconds: 300
      playwright_hosts:
        - flashscore.com
        - www.flashscore.com
        - sofascore.com
        - www.sofascore.com
      wait_selector_ms: 12000
      h2h_wait_ms: 8000
      fetch_h2h_tab: true
      max_xhr_bytes: 1500000
      max_bytes: 2500000
      use_browser_default_ua: true
    exa_fill: false
  exa_mode: optional                # optional | off — narrative fill only; never MIC body
  # Refuse recommend when odds file has zero p_model/evidence (wrong path)
  require_research_for_recommend: true
  board_max_per_match: 6
  board_max_total: 24
  # Multi-sport shortlist (code-is-law): football cannot take entire board
  board_max_football_share: 0.45
  board_min_non_football: 4
  board_max_props: 5
  # Market coverage agent
  high_volume_market_threshold: 40
  market_scan_top_n: 5
  # Adaptive multi-agent scan: Agent D spawn when any match has lines >= this
  # (strict product >40 ⇒ default 41). Do NOT reuse high_volume_market_threshold.
  adaptive_scan_agent_d_min_lines: 41
  # Tiered research: Light (broad) → Deep (evidence + p_model only recommendable)
  # See docs/RESEARCH_WORKFLOW.md and AGENTS.md
  tiers:
    light_coverage_target: 0.85      # ≥85% of shortlist gets Light Research
    light_coverage_min_n: 8
    min_light_per_sport_when_n: 5    # if sport has ≥5 shortlist lines…
    min_light_per_sport: 3           # …light at least 3
    deep_target_n: 8                 # High-Volume v2: focused deep queue (static fallback)
    # Hard cap for queue size. Keep ≥ deep_target_max so dynamic target can reach max.
    # Force paths (scaffold / sport rotation) may expand up to this cap above n_target.
    deep_max_n: 15
    deep_target_dynamic: true        # scale target with board width
    deep_target_min: 8
    deep_target_max: 15              # effective max when dynamic (must be ≤ deep_max_n)
    deep_target_divisor: 8           # target = clamp(min, max, board_lines // divisor)
    auto_light_on_board: true        # board runs light pass automatically
    # assess never promotes; engine fills deep_queue via promotion_score
    auto_promote_to_deep: false
    engine_deep_queue: true
    # ESR: composition floors off. Re-arm only if active overlay omits
    # coverage_preferred_share (None → legacy 0.55); PR2 fail-closed default 0 under ESR.
    deep_min_preferred_share: 0.0
    deep_max_short_main_share: 1.0
    short_chalk_odds: 1.70           # Stage1 drop short-main below 1.70 (was 1.80)
    preferred_odds_lo: 1.40          # ESR: short prices allowed in research band
    preferred_odds_hi: 2.80
    alt_preferred_odds_lo: 1.40
    promo_mid_band_boost: 8          # mild only (was 60 identity)
    promo_mid_band_lo: 1.85          # PR2: mid boost only in this window
    promo_mid_band_hi: 2.40
    promo_alt_boost: 14              # HC / alt totals (was ~8)
    promo_short_chalk_penalty: -12   # mild noise only (was -55)
    promo_preferred_boost: 0         # PR2: was hardcoded +25
    promo_short_main_penalty: 0      # PR2: was hardcoded -30
    promo_require_signal_for_family_boost: true  # PR2: bare HC/alt need signal
    promo_fav_hc_boost: 12           # research rank: elevate favourite HC vs soft dog HC
    promo_natural_total_boost: 10    # research rank: natural O/U markets
    soft_value_min_rel: 0.08         # soft ≥ NT × 1.08 when ref present
    fail_odds_below: 1.40      # align with odds_confidence usable floor
    fail_odds_above: 4.0
    pass_odds_lo: 1.40         # Band A short prices may light-pass
    pass_odds_hi: 2.80

  # Coverage floor (Mechanism A) — dynamic target + scaffolds; never invents p_model
  # 0 values are meaningful (e.g. top_promo_scaffold_pct: 0 disables scaffolds).
  coverage_floor:
    enabled: true
    top_promo_scaffold_pct: 0.20     # force top 20% by promo_score; 0 = off
    sport_rotation_min_lines: 5      # eligible light-pass (no p_model/conflict); 0 = off
    require_real_pack: true          # enforced: queue never includes has_p_model rows
    coverage_pressure_boost: 40      # extra promo boost when force_coverage active (in-band)

  # Coverage Health (board/recommend + Lumina DeskStrip)
  coverage_health:
    warn_deep_pct: 25
    critical_deep_pct: 15
    warn_survivable_pct: 45
    critical_survivable_pct: 30
    critical_mid_unresearched: 5
    warn_mid_unresearched: 3
    soft_gate: true              # block recommend when critical unless --allow-low-coverage
    auto_expand_deep_queue: true

  # Multi-stage quant pre-filter (Stage1 screens + Stage2 classical prior).
  # Research-rank only — never invents p_model. Clean-restart neutral (no learning).
  prefilter:
    enabled: true
    target_discard_share: 0.70     # soft metric for funnel health
    stage1:
      enabled: true
      max_p_needed: 0.78
      drop_short_chalk_ml: true    # short-main ML/O2.5/FG below short_chalk_odds (1.70)
      # Allow short-main <1.70 only when rough_p_needed ≤ strong_data_p_needed (exception)
      strong_data_p_needed: 0.55
      drop_noise_specials: true
      drop_ultra_short_alts: true  # non-main alts below ultra_short_alt_odds
      ultra_short_alt_odds: 1.55
    stage2:
      enabled: true
      min_prior_ev: -0.12          # absolute floor after 3pp haircut
      short_odds_prior_ev_floor: -0.08  # stricter when odds < preferred_odds_lo
      prior_ev_slack_vs_fair: 0.04 # also require worse than fair-by-slack
      blend_weight_implied: 0.55
      require_prior: false
      base_rate_conflict_delta: 0.18

  # Multi-sport research gates — see docs/RESEARCH_GATES.md
  # Legacy flat keys still work (aliased). Prefer nested gates: below.
  require_lineup_status_football: true
  predicted_lineup_ok_for_totals_btts: true
  require_injury_research_if_predicted: true
  require_confirmed_lineup_for_totals_btts: false
  high_rotation_stricter_lineup: true
  high_rotation_require_confirmed: false
  high_odds_prefer_confirmed_lineup: true
  lineup_gate_all_football: false
  reject_script_conflict: true
  reject_base_rate_conflict: true
  gates:
    enabled: true
    reject_script_conflict: true
    reject_base_rate_conflict: true
    require_availability_status: true
    predicted_availability_ok: true          # 12h boards / late XIs
    require_availability_research_if_predicted: true
    high_context_stricter_notes: true        # WC/intl/B2B/bronze
    high_context_min_notes_chars: 40
    high_context_require_confirmed: true     # P0: high-context requires confirmed availability
    strict_confirmed_only: false             # global confirmed-only
    high_odds_prefer_confirmed: true         # soft note
    sports:
      football: { enabled: true }
      tennis: { enabled: true }
      basketball: { enabled: true }
      darts: { enabled: true }
      snooker: { enabled: true }
      default: { enabled: true }

# Football simulation + calibration (optional; never places bets)
# See docs/SIMULATION.md — sim suggests p_model; engine + human still rule.
simulation:
  enabled: true
  calibration_enabled: true
  audit_sims: true
  football:
    default_league_avg_xg: 1.35
    default_home_advantage: 1.08
    default_rho: -0.05   # Dixon–Coles low-score correction
    max_goals: 10
  # Do NOT expand sport_scope until football calibration is proven
  sport_scope:
    - football

git:
  auto_commit: false   # set true only if you want CLI to commit
