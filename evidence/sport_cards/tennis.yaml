schema_version: 1
sport: tennis
display_name: Tennis
version: 1
onboarded: true
individual_sport: true
domain_allowlist:
  - tennisexplorer.com
  - atptour.com
  - wtatennis.com
  - sofascore.com
  - flashscore.com
primary:
  - id: surface_h2h
    name: Surface H2H / matchup
    weight: 1.5
    markets: ["*"]
    require_when: [handicap, underdog_hc]
    sources: [TennisExplorer, Flashscore]
    allows_negative: true
    individual_h2h: true
  - id: serve_return
    name: Serve / return splits
    weight: 1.3
    markets: [totals, handicap, prop]
    require_when: [totals_over, totals_under, handicap]
    sources: [TennisExplorer, Sofascore]
  - id: fitness_fatigue
    name: Fitness / fatigue / retirement risk
    weight: 1.4
    markets: ["*"]
    require_when: [avail_sensitive]
    sources: [Sofascore, ATP/WTA]
secondary:
  - id: ranking_form
    name: Ranking / recent form
    weight: 1.0
    markets: [ml, handicap]
    require_when: [ml]
    sources: [ATP/WTA, TennisExplorer]
  - id: match_script
    name: Match script (short/long)
    weight: 1.1
    markets: [totals, handicap]
    require_when: []
    sources: [pack]
tertiary:
  - id: motivation_round
    name: Round / motivation
    weight: 0.5
    markets: [ml]
    require_when: []
    sources: [draw, news]
grade_floors:
  A: {min_E: 0.72, min_quality_sources: 6, require_uncertainty: true}
  B: {min_E: 0.55, min_quality_sources: 4, require_r: 1.0}
  C: {min_E: 0.30, min_quality_sources: 3}
hard_rejects:
  - {id: HR_NEG_H2H_UD, when: underdog_hc and negative_h2h}
  - {id: HR_NO_MATCHUP_UD, when: underdog_hc mid_band and not h2h_checked}
  - {id: HR_EMPTY_TAKEAWAYS, when: quality_sources < 3}
edges:
  realistic: "Surface-specialist H2H, fatigue after long match, set/game HC with serve edge"
  efficient_markets: "Top-20 ML on slam main"
  inefficient_markets: "Challenger HCs, surface switch, games totals with serve mismatch"
notes: "H2H is never-ignore for underdog HC. Missing H2H mid-band ÔåÆ reject."
