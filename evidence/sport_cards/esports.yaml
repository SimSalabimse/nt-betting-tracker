schema_version: 1
sport: esports
display_name: Esports (CS primary)
version: 1
onboarded: true
individual_sport: false
domain_allowlist:
  - hltv.org
  - liquipedia.net
  - opendota.com
  - dotabuff.com
  - sofascore.com
  - flashscore.com
primary:
  - id: ranking_form
    name: Ranking / recent form
    weight: 1.4
    markets: [ml, handicap]
    require_when: ["*"]
    sources: [HLTV, Liquipedia]
  - id: map_pool
    name: Map pool / veto edge
    weight: 1.3
    markets: [ml, handicap, totals]
    require_when: [handicap, totals_over, totals_under]
    sources: [HLTV]
  - id: roster_standin
    name: Roster / stand-in
    weight: 1.5
    markets: ["*"]
    require_when: [standin, avail_sensitive]
    sources: [Liquipedia, HLTV]
secondary:
  - id: h2h_matchup
    name: H2H on maps
    weight: 1.0
    markets: [ml, handicap]
    require_when: [underdog_hc, handicap]
    sources: [HLTV]
    allows_negative: true
  - id: recent_form
    name: Last 3 months results
    weight: 0.9
    markets: ["*"]
    require_when: []
    sources: [HLTV]
tertiary:
  - id: motivation_context
    name: Event stage / RMR points
    weight: 0.5
    markets: [ml]
    require_when: [high_context]
    sources: [Liquipedia]
grade_floors:
  A: {min_E: 0.72, min_quality_sources: 6, require_uncertainty: true}
  B: {min_E: 0.55, min_quality_sources: 4, require_r: 1.0}
  C: {min_E: 0.30, min_quality_sources: 3}
hard_rejects:
  - {id: HR_WRONG_SPORT_SOURCES, when: football FBref scaffold only}
  - {id: HR_EMPTY_TAKEAWAYS, when: quality_sources < 3}
  - {id: HR_NO_MATCHUP_UD, when: underdog_hc mid_band and not h2h_checked}
  - {id: HR_NEG_H2H_UD, when: underdog_hc and negative_h2h}
edges:
  realistic: "Map-pool HCs, stand-in fades, form mismatches on tier-2 events"
  efficient_markets: "Top-10 BO3 short ML"
  inefficient_markets: "Map HC with veto edge, stand-in maps"
notes: "NEVER use FBref/football sources. HLTV quality takeaways required."
